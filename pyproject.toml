[project]
name = "market-workstation"
version = "0.1.0"
description = "Local personal stock analysis and monitoring system"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy",
  "alembic",
  "psycopg[binary]",
  "pydantic",
  "pydantic-settings",
  "python-dotenv",
  "httpx",
  "pandas",
  "apscheduler",
  "pytest",
  "pytest-asyncio",
  "ruff",
  "mypy"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true