services:
  db:
    image: postgres:16
    container_name: market_workstation_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: market_workstation
      POSTGRES_USER: market_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
