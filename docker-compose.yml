services:
  db:
    image: postgres:16
    container_name: market_workstation_db
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market_workstation}
      POSTGRES_USER: ${POSTGRES_USER:-market_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: market_workstation_api
    init: true
    restart: unless-stopped
    working_dir: /app
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-market-workstation}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DEBUG: ${DEBUG:-false}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-market_workstation}
      POSTGRES_USER: ${POSTGRES_USER:-market_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      DATABASE_URL: ${DATABASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: market_workstation_scheduler
    init: true
    restart: unless-stopped
    working_dir: /app
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-market-workstation}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DEBUG: ${DEBUG:-false}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-market_workstation}
      POSTGRES_USER: ${POSTGRES_USER:-market_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      DATABASE_URL: ${DATABASE_URL:-}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Asia/Taipei}
      SCHEDULER_DAILY_MARKET_ETL_CRON: ${SCHEDULER_DAILY_MARKET_ETL_CRON:-0 18 * * 1-5}
      SCHEDULER_INDICATOR_UPDATE_CRON: ${SCHEDULER_INDICATOR_UPDATE_CRON:-30 18 * * 1-5}
      SCHEDULER_TAIWAN_DERIVATIVES_PIPELINE_CRON: ${SCHEDULER_TAIWAN_DERIVATIVES_PIPELINE_CRON:-40 18 * * 1-5}
      SCHEDULER_DAILY_REPORT_GENERATION_CRON: ${SCHEDULER_DAILY_REPORT_GENERATION_CRON:-0 19 * * 1-5}
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    command: ["python", "-m", "workers.scheduler.main", "--start"]

  analysis:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: market_workstation_analysis
    init: true
    restart: unless-stopped
    working_dir: /app
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-market-workstation}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DEBUG: ${DEBUG:-false}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-market_workstation}
      POSTGRES_USER: ${POSTGRES_USER:-market_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      DATABASE_URL: ${DATABASE_URL:-}
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    command: ["python", "-m", "workers.analysis.main", "--loop-heartbeat"]
